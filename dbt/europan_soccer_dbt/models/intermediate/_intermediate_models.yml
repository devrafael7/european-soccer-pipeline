  - name: int_match_enriched
    description: >
      Partidas enriquecidas com informações de país, liga, times e métricas derivadas.
      O grão do modelo é uma linha por partida.
    columns:
      - name: match_id
        description: Identificador único da partida.
        data_type: number
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_match')
                field: match_id

      - name: match_date
        description: Data em que a partida foi disputada.
        data_type: timestamp

      - name: match_season
        description: Temporada à qual a partida pertence.
        data_type: varchar
        data_tests:
          - not_null

      - name: match_stage
        description: Rodada ou estágio da competição.
        data_type: number

