                to: ref('stg_team')
                field: team_api_id

      - name: home_team_long_name
        description: Nome completo do time mandante.
        data_type: varchar

      - name: home_team_short_name
        description: Nome abreviado do time mandante.
        data_type: varchar

      - name: away_team_api_id
