        data_type: number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_team')
                field: team_api_id

      - name: away_team_long_name
        description: Nome completo do time visitante.
        data_type: varchar

      - name: away_team_short_name
        description: Nome abreviado do time visitante.
        data_type: varchar

      - name: home_team_score
        description: Quantidade de gols marcados pelo time mandante.
        data_type: number
        data_tests:
          - not_null

      - name: away_team_score
        description: Quantidade de gols marcados pelo time visitante.
        data_type: number
        data_tests:
          - not_null

      - name: total_goals
        description: Soma dos gols dos times mandante e visitante.
        data_type: number
        data_tests:
          - not_null

      - name: winner_team_api_id
        description: Identificador API do time vencedor. Nulo em caso de empate.
        data_type: number

      - name: match_winner
        description: Nome do time vencedor. Nulo em caso de empate.
        data_type: varchar

      - name: match_result
        description: Resultado da partida pela perspectiva de mando.
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home Win', 'Away Win', 'Draw']


  - name: int_match_per_player
    description: >
      Relação normalizada entre partidas e jogadores originalmente armazenados
      nas 22 colunas de escalação da tabela de partidas.
      O grão do modelo é uma linha por jogador e posição em cada partida.
  
    columns:
      - name: match_id
        description: Identificador da partida.
        data_type: number
