version: 2

models:
  - name: int_event_card
    description: >
      Eventos de cartões extraídos do XML da tabela de partidas.
      O grão do modelo é uma linha por evento de cartão em uma partida.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - match_id
              - card_id
    columns:
      - name: match_id
        description: Identificador da partida associada ao evento.
        data_type: number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_match')
                field: match_id

      - name: card_id
        description: Identificador do evento de cartão dentro dos dados de origem.
        data_type: number
        data_tests:
          - not_null

      - name: card_minute
        description: Minuto regulamentar em que o cartão ocorreu.
        data_type: number
        data_tests:
          - not_null

      - name: stoppage_time
        description: Minutos de acréscimo do evento, quando informados.
        data_type: number

      - name: match_half
        description: Período da partida em que o cartão ocorreu.
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['First Half', 'Second Half']

      - name: card_received_player_api_id
        description: Identificador API do jogador que recebeu o cartão. Pode ser nulo quando o jogador é desconhecido.
        data_type: number

      - name: card_type
        description: Tipo tratado do cartão recebido pelo jogador.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['Yellow Card', 'Red Card', 'Second Yellow Card']

      - name: is_sent_off
        description: Indica se o cartão resultou na expulsão do jogador.
        data_type: boolean
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

      - name: team_api_id
        description: Identificador API do time associado ao evento.
        data_type: number

      - name: foul_type
        description: Subtipo ou descrição da infração relacionada ao cartão.
        data_type: varchar

      - name: incident_type_id
        description: Identificador do tipo de incidente fornecido pela origem.
        data_type: number

      - name: event_attribute
        description: Classificação constante do evento.
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CARD']


