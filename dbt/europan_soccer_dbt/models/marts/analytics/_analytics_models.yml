  - name: rpt_player_league_season_leaderboard
    description: >
      Relatório de ranking de jogadores por liga e temporada. Mantém as
      métricas do agregado e adiciona posições para gols, assistências,
      participações em gols, chutes, precisão e conversão.
    columns:
      - name: player_league_season_key
