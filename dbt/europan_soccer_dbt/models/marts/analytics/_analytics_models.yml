version: 2

models:
  - name: agg_player_career_stats
    description: >
      Agregado histórico com uma linha por jogador. Resume partidas,
      temporadas, times, gols, assistências, finalizações, faltas e cartões
      ao longo de todo o período disponível.
    columns:
      - name: player_id
        description: Chave do jogador e granularidade principal do modelo.
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id

      - name: player_api_id
        description: Identificador natural do jogador.
        data_tests:
          - unique
          - not_null

      - name: player_name
        description: Nome do jogador.

      - name: matches_played
        description: Quantidade de partidas com registro do jogador.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: matches_started
        description: Quantidade de partidas iniciadas como titular.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: substitute_appearances
        description: Quantidade de aparições identificadas fora da escalação inicial.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: seasons_played
        description: Quantidade de temporadas distintas com registro.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: leagues_played
        description: Quantidade de ligas distintas com registro.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: countries_played
        description: Quantidade de países distintos com registro.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: teams_played
        description: Quantidade de times distintos representados pelo jogador.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: first_match_date
        description: Primeira data de partida registrada para o jogador.

      - name: last_match_date
        description: Última data de partida registrada para o jogador.

      - name: total_goals
        description: Total de gols na carreira registrada.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: total_assists
        description: Total de assistências na carreira registrada.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: total_goal_contributions
        description: Soma de gols e assistências.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: total_shots_on_target
        description: Total de chutes no alvo.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: total_shots_off_target
        description: Total de chutes para fora.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: total_shots
        description: Total de finalizações.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: total_fouls_committed
        description: Total de faltas cometidas.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: total_fouls_suffered
        description: Total de faltas sofridas.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: total_yellow_cards
        description: Total de cartões amarelos.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: total_second_yellow_cards
        description: Total de segundos cartões amarelos.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: total_red_cards
        description: Total de cartões vermelhos diretos.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: total_sent_offs
        description: Total de expulsões.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: total_crosses
        description: Total de cruzamentos.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: total_corners_taken
        description: Total de escanteios cobrados.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: matches_with_goals
        description: Partidas nas quais o jogador marcou ao menos um gol.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: matches_with_assists
        description: Partidas nas quais o jogador registrou ao menos uma assistência.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: goals_per_match
        description: Média de gols por partida registrada.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: goals_per_match is not null

      - name: assists_per_match
        description: Média de assistências por partida registrada.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: assists_per_match is not null

      - name: goal_contributions_per_match
        description: Média de participações em gols por partida.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: goal_contributions_per_match is not null

      - name: shot_accuracy_pct
        description: Percentual de finalizações que foram no alvo.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 100"
              config:
                where: shot_accuracy_pct is not null

      - name: goal_conversion_pct
        description: Percentual de finalizações convertidas em gol.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 100"
              config:
                where: goal_conversion_pct is not null

