  - name: agg_team_season_standings
    description: >
      Classificação calculada por time, liga e temporada. Cada partida é
      convertida para a perspectiva de cada time antes da agregação.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - match_season
              - league_id
              - team_api_id
      - dbt_utils.expression_is_true:
          arguments:
            expression: "matches_played = wins + draws + losses"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "matches_played = home_matches + away_matches"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "points = wins * 3 + draws"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "goal_difference = goals_for - goals_against"

    columns:
      - name: team_season_key
        description: Chave substituta do time na liga e temporada.
        data_tests:
          - unique
          - not_null

      - name: calculated_league_position
        description: Posição calculada por pontos, saldo de gols e gols marcados.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: match_season
        description: Temporada da classificação.
        data_tests:
          - not_null

      - name: league_id
        description: Identificador da liga.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_leagues')
                field: league_id

      - name: league_name
        description: Nome da liga.
        data_tests:
          - not_null

      - name: country_id
        description: Identificador do país.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_countries')
                field: country_id

      - name: country_name
        description: Nome do país.
        data_tests:
          - not_null

      - name: team_id
        description: Identificador interno do time.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id

      - name: team_api_id
        description: Identificador natural do time.
        data_tests:
          - not_null

      - name: team_long_name
        description: Nome completo do time.
        data_tests:
          - not_null

      - name: team_short_name
        description: Nome curto do time.

      - name: matches_played
        description: Total de partidas disputadas.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: wins
        description: Vitórias.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: draws
        description: Empates.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: losses
        description: Derrotas.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: home_matches
        description: Partidas disputadas em casa.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: away_matches
        description: Partidas disputadas como visitante.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: home_wins
        description: Vitórias em casa.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: away_wins
        description: Vitórias como visitante.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: goals_for
        description: Gols marcados pelo time.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: goals_against
        description: Gols sofridos pelo time.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: goal_difference
        description: Diferença entre gols marcados e sofridos.

      - name: points
        description: Pontos calculados com três por vitória e um por empate.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: clean_sheets
        description: Partidas sem sofrer gols.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: matches_without_scoring
        description: Partidas sem marcar gols.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: most_goals_in_match
        description: Maior quantidade de gols marcados pelo time em uma partida.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: biggest_win_margin
        description: Maior saldo obtido pelo time em uma partida.

      - name: first_match_date
        description: Primeira data de partida do time na temporada.

      - name: last_match_date
        description: Última data de partida do time na temporada.

      - name: win_rate_pct
        description: Percentual de vitórias.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 100"

      - name: goals_for_per_match
        description: Média de gols marcados por partida.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: goals_against_per_match
        description: Média de gols sofridos por partida.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
