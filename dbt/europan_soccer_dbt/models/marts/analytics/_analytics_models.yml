      - dbt_utils.expression_is_true:
          arguments:
            expression: "matches_played = home_wins + away_wins + draws"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_goals = home_goals + away_goals"

    columns:
      - name: league_season_key
        description: Chave substituta da liga e temporada.
        data_tests:
          - unique
          - not_null

      - name: match_season
        description: Temporada analisada.
        data_tests:
