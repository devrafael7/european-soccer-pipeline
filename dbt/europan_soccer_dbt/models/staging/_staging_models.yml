version: 2
models:
- name: stg_country
  description: 'Cleaned staging representation of the RAW country source. Grain: one row per country.'
  columns:
  - name: country_id
    description: Primary key that identifies a country.
    data_type: integer
    data_tests:
    - not_null
    - unique
  - name: country_name
    description: Cleaned country name.
    data_type: varchar
    data_tests:
    - not_null
    - unique
  - name: loaded_at
    description: Timestamp generated when the staging model is queried or materialized. This is a transformation
      timestamp, not the original source ingestion time.
    data_type: timestamp_ltz
- name: stg_league
  description: 'Cleaned staging representation of the RAW league source. Grain: one row per league.'
  columns:
  - name: league_id
    description: Primary key that identifies a league.
    data_type: integer
    data_tests:
    - not_null
    - unique
  - name: country_id
    description: Identifier of the country in which the league is played.
    data_type: integer
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_country')
          field: country_id
  - name: league_name
    description: Cleaned league name.
    data_type: varchar
    data_tests:
    - not_null
  - name: loaded_at
    description: Timestamp generated when the staging model is queried or materialized.
    data_type: timestamp_ltz
- name: stg_match
  description: 'Cleaned staging representation of the RAW match source, including identifiers, scores, lineups,
    formation coordinates, XML event payloads, and bookmaker odds. Grain: one row per match.'
  data_tests:
  - dbt_utils.expression_is_true:
      arguments:
        expression: home_team_api_id <> away_team_api_id
  columns:
  - name: match_id
    description: Primary key of the match record.
    data_type: integer
    data_tests:
    - not_null
    - unique
  - name: country_id
    description: Identifier of the country associated with the match.
    data_type: integer
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_country')
          field: country_id
  - name: league_id
    description: Identifier of the league associated with the match.
    data_type: integer
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_league')
          field: league_id
  - name: match_season
    description: Season in which the match was played, such as 2015/2016.
    data_type: varchar
    data_tests:
    - not_null
  - name: match_stage
    description: Round or stage number within the season.
    data_type: integer
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
  - name: match_date
    description: Date and time at which the match was played.
    data_type: timestamp_ntz
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          max_value: current_date
  - name: match_api_id
    description: External API identifier of the match.
    data_type: integer
    data_tests:
    - not_null
    - unique
  - name: home_team_api_id
    description: External API identifier of the home team.
    data_type: integer
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_team')
          field: team_api_id
  - name: away_team_api_id
    description: External API identifier of the away team.
    data_type: integer
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_team')
          field: team_api_id
  - name: home_team_goal
    description: Number of goals scored by the home team.
    data_type: integer
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
  - name: away_team_goal
    description: Number of goals scored by the away team.
    data_type: integer
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
