- name: stg_player
  description: 'Cleaned staging representation of the RAW player source. Grain: one row per player.'
  columns:
  - name: player_id
    description: Primary key of the player record in the source dataset.
    data_type: integer
    data_tests:
    - not_null
    - unique
  - name: player_api_id
    description: External API identifier of the player.
    data_type: integer
    data_tests:
    - not_null
    - unique
  - name: player_name
    description: Cleaned player name.
    data_type: varchar
    data_tests:
    - not_null
  - name: player_fifa_api_id
    description: FIFA API identifier of the player, when available.
    data_type: integer
  - name: player_birthday
    description: Player date of birth.
    data_type: date
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: '''1960-01-01'''
          max_value: current_date
  - name: height
    description: Player height in centimeters. Non-positive source values are converted to null.
    data_type: number
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 100
          max_value: 250
  - name: weight
    description: Player weight in pounds. Source values less than or equal to 30 are converted to null.
    data_type: number
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 30
          max_value: 300
          inclusive: false
  - name: loaded_at
    description: Timestamp generated when the staging model is queried or materialized.
    data_type: timestamp_ltz
- name: stg_player_attributes
  description: 'Cleaned staging representation of historical player attribute snapshots. Grain: one row per player
    and attribute snapshot date.'

  columns:
  - name: player_atb_id
    description: Primary key of the player-attribute snapshot record.
    data_type: integer
    data_tests:
    - not_null
    - unique
  - name: player_fifa_api_id
    description: FIFA API identifier associated with the player snapshot.
    data_type: integer
  - name: player_api_id
    description: External API identifier of the player associated with the snapshot.
    data_type: integer
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_player')
          field: player_api_id
  - name: last_atb_update_date
    description: Date of the player-attribute snapshot. The double underscore is retained to match the current SQL
      model.
    data_type: timestamp_ntz
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          max_value: current_date
  - name: overall_rating
    description: Overall player rating at the snapshot date.
    data_type: integer
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 100
  - name: potential
    description: Potential player rating at the snapshot date.
    data_type: integer
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 100
  - name: preferred_foot
    description: Player's preferred foot.
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values:
          - left
          - right
  - name: attacking_work_rate
    description: Source classification of the player's attacking work rate.
    data_type: varchar
  - name: defensive_work_rate
    description: Source classification of the player's defensive work rate.
    data_type: varchar
  - name: crossing
